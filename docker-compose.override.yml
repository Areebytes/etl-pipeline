services:
  mongodb:
    image: mongo:7.0
    restart: always
    labels:                                  # image/container meta details
      project: "currency-etl"
      component: "database"
      maintainer: "your-name"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db                  # persistent storage
    networks:
      - airflow                              # same network as Airflow

  mongo-express:
    image: mongo-express:1.0.2
    restart: always
    labels:
      project: "currency-etl"
      component: "db-admin-ui"
      maintainer: "your-name"
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_BASICAUTH_USERNAME: admin    # login for the Mongo Express web page
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - airflow

volumes:
  mongo_data: